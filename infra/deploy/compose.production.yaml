services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infra/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-engine:
    image: ${AI_ENGINE_IMAGE:?AI_ENGINE_IMAGE is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${AI_DATABASE_URL:?AI_DATABASE_URL is required}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      DEFAULT_LLM: ${DEFAULT_LLM:-groq-openai/gpt-oss-120b}
      FALLBACK_LLM: ${FALLBACK_LLM:-gemini-3.6-flash}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      AI_ENGINE_PORT: "8001"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COLLECTION_NAME: ${COLLECTION_NAME:-sprintsmith_requirements}
    expose:
      - "8001"
    volumes:
      - core_uploads:/shared/uploads
    depends_on:
      db:
        condition: service_healthy

  backend-core:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL:?BACKEND_DATABASE_URL is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      AI_ENGINE_URL: http://ai-engine:8001
      UPLOAD_DIR: /shared/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      AUTO_CREATE_TABLES: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - core_uploads:/shared/uploads
    depends_on:
      db:
        condition: service_healthy
      ai-engine:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend-core:
        condition: service_healthy

volumes:
  postgres_data:
  core_uploads:
  caddy_data:
  caddy_config: