name: Production Deployment

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Build and deploy backend to GCP
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/833405754913/locations/global/workloadIdentityPools/sprintsmith-github/providers/github
          service_account: sprintsmith-github-deploy@major-project-512815.iam.gserviceaccount.com
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: major-project-512815
      - name: Build and deploy backend
        run: bash infra/deploy/deploy-gcp.sh

  deploy-frontend:
    name: Deploy frontend to Cloudflare Workers
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_FRONTEND == 'true'
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://sprintsmith-api.rajmathuria.me
        run: npm run build
      - name: Deploy Cloudflare Worker
        working-directory: frontend
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
