name: DevPilot Backend Core

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - "backend-core/backend/**"
      - ".github/workflows/backend-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-core/backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ./run_tests.sh coverage --junitxml=junit.xml --cov-report=xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devpilot-backend-test-reports
          path: |
            backend-core/backend/junit.xml
            backend-core/backend/coverage.xml
          if-no-files-found: warn

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sprintsmith
          POSTGRES_PASSWORD: sprintsmith
          POSTGRES_DB: sprintsmith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sprintsmith -d sprintsmith"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend-core/backend
    env:
      DATABASE_URL: postgresql+psycopg://sprintsmith:sprintsmith@localhost:5432/sprintsmith
      TEST_DATABASE_URL: postgresql+psycopg://sprintsmith:sprintsmith@localhost:5432/sprintsmith
      JWT_SECRET_KEY: ci-only-secret
      AI_ENGINE_URL: http://localhost:8001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-core/backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest tests/repositories tests/integration tests/contract -q