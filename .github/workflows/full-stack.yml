name: Full Stack Platform

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Compose profiles
        run: docker compose --profile core config
      - name: Start platform services
        run: docker compose up -d --build
      - name: Run integration smoke test
        run: ./scripts/smoke_test.sh
      - name: Print service status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop services
        if: always()
        run: docker compose down -v